<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mudget">
<meta name="theme-color" content="#0d0f0e">
<title>Mudget</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scan"></div>

<div id="app">

  <!-- ONBOARDING -->
  <section id="onboarding" class="screen">
    <div class="onboard-inner">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <h1>MUDGET</h1>
      </div>
      <p class="tag">cycle budgeting, built for dorm life</p>

      <div class="field-group">
        <label>How much do you get, and how often?</label>
        <div class="row">
          <div class="input-wrap">
            <span class="prefix">₱</span>
            <input type="number" id="ob-amount" placeholder="1000" inputmode="numeric">
          </div>
          <span class="per">every</span>
          <div class="input-wrap small">
            <input type="number" id="ob-days" placeholder="4" inputmode="numeric">
          </div>
          <span class="per">days</span>
        </div>
      </div>

      <div class="field-group">
        <label>Save target per cycle</label>
        <div class="input-wrap">
          <span class="prefix">₱</span>
          <input type="number" id="ob-save" placeholder="200" inputmode="numeric">
        </div>
      </div>

      <button class="btn-primary" id="ob-continue">SET UP ENVELOPES →</button>
    </div>
  </section>

  <!-- MAIN -->
  <section id="main" class="screen hidden">

    <header class="topbar">
      <div class="topbar-left">
        <span class="brand-mark small">◆</span>
        <span class="brand-name">MUDGET</span>
      </div>
      <button class="icon-btn" id="open-settings">⚙</button>
    </header>

    <div class="tabbar">
      <button class="tab-btn active" data-tab="home">HOME</button>
      <button class="tab-btn" data-tab="calendar">CALENDAR</button>
      <button class="tab-btn" data-tab="stats">STATS</button>
    </div>

    <div id="tab-home" class="tab-panel">

    <div class="cycle-card">
      <div class="cycle-top">
        <div>
          <div class="eyebrow">CURRENT CYCLE</div>
          <div class="cycle-days" id="cycle-days-left">4 DAYS LEFT</div>
        </div>
        <div class="cycle-status" id="cycle-status">ON TRACK</div>
      </div>

      <div class="cycle-bar-wrap">
        <div class="cycle-bar" id="cycle-bar"></div>
      </div>

      <div class="cycle-nums">
        <div class="num-block">
          <div class="num-label">SPENT</div>
          <div class="num-value" id="spent-total">₱0</div>
        </div>
        <div class="num-block">
          <div class="num-label">REMAINING</div>
          <div class="num-value accent" id="remaining-total">₱0</div>
        </div>
        <div class="num-block">
          <div class="num-label">SAVED</div>
          <div class="num-value good" id="saved-total">₱0</div>
        </div>
      </div>

      <div class="rec-per-day" id="rec-per-day"></div>
    </div>

    <div class="section-label">ENVELOPES</div>

    <div class="envelopes" id="envelopes-list"></div>

    <div class="section-label">LOG</div>

    <div class="log-list" id="log-list"></div>

    </div><!-- /tab-home -->

    <div id="tab-calendar" class="tab-panel hidden">
      <div class="cal-card">
        <div class="cal-header">
          <button class="icon-btn small" id="cal-prev">‹</button>
          <div class="cal-month-label" id="cal-month-label">MONTH</div>
          <button class="icon-btn small" id="cal-next">›</button>
        </div>
        <div class="cal-weekdays">
          <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-legend">
          <span class="legend-dot ok"></span><span>under pace</span>
          <span class="legend-dot warn"></span><span>heavy day</span>
        </div>
      </div>
      <div class="section-label">SELECTED DAY</div>
      <div class="log-list" id="cal-day-log"></div>
    </div>

    <div id="tab-stats" class="tab-panel hidden">
      <div class="stats-grid" id="stats-summary"></div>
      <div class="section-label">CYCLE HISTORY</div>
      <div class="history-list" id="history-list"></div>
    </div>

    <button class="fab" id="open-add">＋</button>
  </section>

  <!-- ADD EXPENSE SHEET -->
  <div id="add-sheet" class="sheet hidden">
    <div class="sheet-backdrop" id="add-backdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <h2>LOG A SPEND</h2>

      <div class="input-wrap large">
        <span class="prefix">₱</span>
        <input type="number" id="add-amount" placeholder="0" inputmode="numeric" autofocus>
      </div>

      <div class="quick-amounts" id="quick-amounts"></div>

      <div class="envelope-picker" id="envelope-picker"></div>

      <input type="text" id="add-note" class="note-input" placeholder="what was it for? (optional)">

      <div class="field-group date-field">
        <label>When</label>
        <input type="datetime-local" id="add-date" class="date-input">
      </div>

      <button class="btn-primary" id="add-confirm">ADD</button>
      <button class="btn-danger hidden" id="add-delete">DELETE ENTRY</button>
    </div>
  </div>

  <!-- SETTINGS SHEET -->
  <div id="settings-sheet" class="sheet hidden">
    <div class="sheet-backdrop" id="settings-backdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <h2>SETTINGS</h2>

      <div class="settings-scroll">

      <details class="settings-section" open>
        <summary>Cycle</summary>
        <div class="settings-section-body">
          <div class="field-group">
            <label>Cycle amount</label>
            <div class="input-wrap">
              <span class="prefix">₱</span>
              <input type="number" id="set-amount" inputmode="numeric">
            </div>
          </div>

          <div class="field-group">
            <label>Cycle length (days)</label>
            <div class="input-wrap small">
              <input type="number" id="set-days" inputmode="numeric">
            </div>
          </div>

          <div class="field-group" style="margin-bottom:0;">
            <label>Save target</label>
            <div class="row">
              <div class="input-wrap">
                <span class="prefix">₱</span>
                <input type="number" id="set-save" inputmode="numeric">
              </div>
              <button type="button" class="btn-ghost auto-save-btn" id="auto-save-target">AUTO (20%)</button>
            </div>
          </div>
        </div>
      </details>

      <details class="settings-section">
        <summary>Envelopes</summary>
        <div class="settings-section-body">
          <div class="field-group" style="margin-bottom:0;">
            <label>Name · color · amount</label>
            <div id="envelope-edit-list"></div>
            <button class="btn-ghost" id="add-envelope-row">+ ADD ENVELOPE</button>
          </div>
        </div>
      </details>

      <details class="settings-section">
        <summary>Appearance</summary>
        <div class="settings-section-body">
          <div class="field-group" style="margin-bottom:0;">
            <label>Theme &amp; accent</label>
            <div class="appearance-row">
              <div class="theme-icon-toggle">
                <button class="theme-icon-btn" id="theme-dark" data-theme="dark" title="Dark">
                  <svg viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
                </button>
                <button class="theme-icon-btn" id="theme-light" data-theme="light" title="Light">
                  <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8 6 18M18 6l1.8-1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                </button>
              </div>
              <div class="appearance-divider"></div>
              <div class="accent-picker" id="accent-picker"></div>
            </div>
          </div>
        </div>
      </details>

      <details class="settings-section danger-section">
        <summary>Danger zone</summary>
        <div class="settings-section-body">
          <button class="btn-danger" id="settings-reset">START NEW CYCLE NOW</button>
          <button class="btn-danger severe" id="settings-delete-all">DELETE ALL DATA</button>
        </div>
      </details>

      </div><!-- /settings-scroll -->

      <div class="settings-footer">
        <button class="btn-primary" id="settings-save">SAVE CHANGES</button>
        <button class="btn-ghost" id="settings-close">CLOSE</button>
      </div>
    </div>
  </div>

</div>

<div id="undo-toast" class="undo-toast hidden">
  <span id="undo-toast-msg">Entry deleted</span>
  <button id="undo-toast-btn">UNDO</button>
</div>

<script src="app.js"></script>
</body>
</html>
